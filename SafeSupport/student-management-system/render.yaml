services:
  - type: web
    name: SafeSupport Backend
    env: java
    region: oregon
    plan: free
    buildCommand: ./mvnw clean package
    startCommand: java -jar target/safesupport-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend.netlify.app,http://localhost:5173
