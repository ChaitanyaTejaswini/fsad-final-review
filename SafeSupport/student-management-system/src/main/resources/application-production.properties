# Production Configuration for Railway

# MySQL Database - Use Railway MySQL or free alternative
spring.datasource.url=${DATABASE_URL:jdbc:mysql://your-mysql-host:3306/fsad}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PASSWORD:Veeru@2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pooling
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Security & Error Handling
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# JWT Configuration
jwt.secret=${JWT_SECRET:SafeSupportSecretKey2026VeryLongSecureKeyForJwtTokenGeneration}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - Allow deployed frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://your-frontend.netlify.app}

# Admin Seeder
app.admin.name=Admin
app.admin.email=admin@example.com
app.admin.password=Admin@123

# Logging
logging.level.root=INFO
logging.level.com.example=INFO