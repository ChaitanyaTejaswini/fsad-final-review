# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/fsad
spring.datasource.username=root
spring.datasource.password=Veeru@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=9092

# Error response hardening
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# JWT Configuration
jwt.secret=SafeSupportSecretKey2026VeryLongSecureKeyForJwtTokenGeneration
jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173

# Admin Seeder
app.admin.name=Admin
app.admin.email=admin@example.com
app.admin.password=Admin@123
