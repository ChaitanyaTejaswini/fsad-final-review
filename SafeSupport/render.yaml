services:
  - type: web
    name: safesupport-backend
    plan: free
    runtime: docker
    rootDir: student-management-system
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/resources
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_ADMIN_NAME
        value: Admin
      - key: APP_ADMIN_EMAIL
        value: admin@example.com
      - key: APP_ADMIN_PASSWORD
        sync: false
