[build]
  command = "npm run build"
  publish = "dist"

# Redirect all non-file routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Set this to your deployed backend URL
  VITE_API_URL = "https://your-backend-url.render.com"

# Environment variables (set these in Netlify dashboard as well)
# VITE_API_URL = https://your-deployed-backend.render.com
