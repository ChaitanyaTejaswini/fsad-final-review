# Railway Configuration for SafeSupport Backend (Root level for monorepo)

[env]
SPRING_PROFILES_ACTIVE = "production"
PORT = "8080"

[[services]]
name = "SafeSupport Backend"
source = "./student-management-system"
buildCommand = "cd student-management-system && ./mvnw clean package"
startCommand = "cd student-management-system && java -jar target/safesupport-0.0.1-SNAPSHOT.jar"

[services.variables]
SPRING_PROFILES_ACTIVE = "production"
PORT = "8080"
# Add these in Railway dashboard:
# DATABASE_URL = jdbc:mysql://your-mysql-host/fsad
# DATABASE_USER = your_db_user
# DATABASE_PASSWORD = your_db_password
# JWT_SECRET = your_jwt_secret
# CORS_ALLOWED_ORIGINS = https://your-frontend.netlify.app